# Fabrique un APK Android de test à chaque push sur prototype (ou à la demande) et le met en ligne
# dans la release « android-test » du dépôt, à télécharger depuis le téléphone.
# Pas de compte Expo : l'APK est signé avec la clé de test d'Android, il s'installe à la main (pas via le Play Store).
name: APK Android de test

on:
  workflow_dispatch:
  push:
    branches: [prototype]
    paths: ['src/**', 'assets/**', 'app.json', 'package.json', 'package-lock.json', 'eas.json', '.github/workflows/android-test.yml']

concurrency:
  group: android-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Les mêmes variables publiques que le profil « preview » d'eas.json (adresse de la base et clé publique)
      - name: Variables de l'app
        run: jq -r '.build.preview.env | to_entries[] | "\(.key)=\(.value)"' eas.json >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
      - name: Compilation
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Mise en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk coach-os-test.apk
          NOTES="Version de test du $(date -u '+%d/%m/%Y %H:%M') UTC, commit ${GITHUB_SHA::7}. À ouvrir depuis le téléphone Android pour l'installer."
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Coach OS · APK Android de test" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release edit android-test --notes "$NOTES"
          gh release upload android-test coach-os-test.apk --clobber
