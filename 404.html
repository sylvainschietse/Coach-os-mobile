    <script>
      // Lien « Répondre » des mails de rendez-vous (…/rdv/<jeton>) : ouvert sur la page légère rdv.html,
      // qui s'affiche tout de suite même en 4G faible ou sur un vieil iPhone.
      (function () {
        var m = /^(.*)\/rdv\/([0-9a-fA-F-]{36})\/?$/.exec(window.location.pathname);
        if (m) window.location.replace(m[1] + '/rdv.html?j=' + m[2] + window.location.search.replace(/^\?/, '&') + window.location.hash);
      })();
    </script>
