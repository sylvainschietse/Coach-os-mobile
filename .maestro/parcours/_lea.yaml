# Sous-parcours : ouvrir l'appli démo en tant que Léa (cliente fictive) et accepter le consentement.
appId: com.coachgo.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Je suis Léa, client'
    timeout: 60000
- tapOn: 'Je suis Léa, client'
- tapOn: 'J’accepte que mes données de santé.*'
- tapOn: 'Continuer'
- extendedWaitUntil:
    visible: 'Bonjour, Léa'
    timeout: 15000
